# Backend CI — Phase 3 Group 1 (Go API skeleton), Group 2 (PostgreSQL foundation) and Group 4 (Go code
# generated from the public API contract); Phase 4 Group 1 (database role separation, sqlc, tenant
# registry, row-level security catalog guard); Phase 4 Group 3 (client portal API code generation).
#
# The job names below are the status-check names required on `main`; do not rename them:
#   "Go test and build", "Go lint", "Go vulnerability check".
# Group 4 adds "Go generate check (Windows)", which proves the documented generation commands on Windows
# (oapi-codegen, and sqlc from Phase 4 Group 1).
#
# Security: least-privilege token (read-only contents), actions pinned to full commit SHAs, no
# repository secrets used, credentials not persisted after checkout. Tool versions are pinned in
# `env`. The PostgreSQL passwords below are throwaway values for a service container that exists
# only for the duration of the job and is reachable only from the runner's loopback interface.
name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.4"           # decision log §7; must match backend/go.mod `toolchain`
  GOTOOLCHAIN: local             # never download a different toolchain inside CI
  GOLANGCI_LINT_VERSION: v2.15.0
  GOVULNCHECK_VERSION: v1.10.0
  # PostgreSQL 18 (ADR-0005), pinned by tag and multi-platform digest (owner decision L2, Group 6).
  # Must be identical to infra/local/compose.yaml; the "Local stack check" job enforces this.
  POSTGRES_IMAGE: postgres:18.7-trixie@sha256:c699303802144847d238196173655dbbecf7a96aeca1565f2b02eb671a1f0b6b

defaults:
  run:
    working-directory: backend

jobs:
  test:
    name: Go test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        # Service images cannot use the workflow-level env; keep in sync with POSTGRES_IMAGE.
        image: postgres:18.7-trixie@sha256:c699303802144847d238196173655dbbecf7a96aeca1565f2b02eb671a1f0b6b
        env:
          POSTGRES_DB: sms
          POSTGRES_USER: sms
          POSTGRES_PASSWORD: ci-throwaway-not-a-secret
        ports:
          - 127.0.0.1:5432:5432
        # The job's steps start only after this health check passes.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -p 5432 -U sms -d sms"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      APP_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: sms
      # The bootstrap superuser: used by the test helpers to create databases and provision roles.
      DB_USER: sms
      DB_PASSWORD: ci-throwaway-not-a-secret
      DB_SSLMODE: disable
      # Passwords of the application roles (Phase 4 Group 1), set by the "Provision database roles"
      # step and read by the integration tests (dbtest.RoleConfig) and the smoke tests below.
      DB_MIGRATOR_PASSWORD: ci-throwaway-migrator-not-a-secret
      DB_APP_PASSWORD: ci-throwaway-app-not-a-secret
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            backend/go.sum
            backend/tools/go.sum

      - name: Show Go version
        run: go version

      - name: Check formatting (gofmt)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify modules
        run: |
          go mod verify
          go mod tidy -diff
          # The separate module that version-locks the code generators (owner decision D5).
          go -C tools mod verify
          go -C tools mod tidy -diff

      # Generated code must match the approved specification and must never be edited by hand: regenerate
      # with the locked generator and fail on any difference, on any new or modified file, or if two runs
      # differ (non-deterministic output).
      - name: Check generated code is up to date
        run: |
          set -euo pipefail
          # Each generator run writes exactly one file per package (public API, Phase 3 Group 4; client
          # portal API, Phase 4 Group 3); any other *.gen.go there was not generated by it.
          for pkg in publicapi portalapi; do
            generated="$(git ls-files -- "internal/${pkg}/*.gen.go")"
            if [ "${generated}" != "internal/${pkg}/${pkg}.gen.go" ]; then
              echo "::error::Unexpected generated-looking files in internal/${pkg}: ${generated}"
              exit 1
            fi
            go generate "./internal/${pkg}/..."
            if ! git diff --exit-code -- "internal/${pkg}"; then
              echo "::error::internal/${pkg} is stale or was edited by hand. Run 'go generate ./internal/${pkg}/...' from backend/ and commit the result."
              exit 1
            fi
            changed="$(git status --porcelain --untracked-files=all -- "internal/${pkg}" tools)"
            if [ -n "${changed}" ]; then
              echo "::error::Generation created or modified files that are not committed:"
              echo "${changed}"
              exit 1
            fi
            first="$(sha256sum "internal/${pkg}/${pkg}.gen.go")"
            go generate "./internal/${pkg}/..."
            if [ "${first}" != "$(sha256sum "internal/${pkg}/${pkg}.gen.go")" ]; then
              echo "::error::Code generation is not deterministic (internal/${pkg})."
              exit 1
            fi
          done

      # sqlc output (ADR-0014; Phase 4 Group 1) is reproducible: the package is deleted and regenerated
      # with the locked sqlc version; any difference, extra (hand-written) or missing file fails, and a
      # second generation must be byte-identical.
      - name: Check sqlc-generated code is up to date
        run: |
          set -euo pipefail
          rm -rf internal/database/sqlcgen
          go generate ./internal/database/...
          changed="$(git status --porcelain --untracked-files=all -- internal/database/sqlcgen tools)"
          if [ -n "${changed}" ]; then
            echo "::error::internal/database/sqlcgen is stale, was edited by hand, or contains files sqlc does not generate. Run 'go generate ./internal/database/...' from backend/ and commit the result."
            echo "${changed}"
            git diff -- internal/database/sqlcgen
            exit 1
          fi
          first="$(cat internal/database/sqlcgen/*.go | sha256sum)"
          go generate ./internal/database/...
          if [ "${first}" != "$(cat internal/database/sqlcgen/*.go | sha256sum)" ]; then
            echo "::error::sqlc generation is not deterministic."
            exit 1
          fi

      - name: go vet
        run: |
          go vet ./...
          go vet -tags integration ./...
          go vet -tags integration,rlseval ./...

      - name: Unit tests
        run: go test -count=1 ./...

      - name: Race tests
        run: go test -race -count=1 ./...

      - name: Check PostgreSQL service version
        run: |
          docker ps --filter "ancestor=${POSTGRES_IMAGE}" --format '{{.Image}} {{.Status}}'
          version="$(docker exec "$(docker ps -q --filter "ancestor=${POSTGRES_IMAGE}")" \
            psql -U sms -d sms -Atc 'SHOW server_version')"
          echo "PostgreSQL server_version: ${version}"
          case "${version}" in 18.*) ;; *) echo "expected PostgreSQL 18.x"; exit 1 ;; esac

      # The same idempotent script as the local stack (infra/local/postgres-init/10-sms-roles.sh with
      # backend/internal/database/dbroles/provision.sql), run twice to prove that a second run is safe.
      # It creates sms_migrator and sms_app and sets their passwords from the job's throwaway values.
      - name: Provision database roles (same script as the local stack, run twice)
        env:
          SMS_MIGRATOR_PASSWORD: ${{ env.DB_MIGRATOR_PASSWORD }}
          SMS_APP_PASSWORD: ${{ env.DB_APP_PASSWORD }}
        run: |
          set -euo pipefail
          cid="$(docker ps -q --filter "ancestor=${POSTGRES_IMAGE}")"
          docker exec "${cid}" mkdir -p /sms
          docker cp internal/database/dbroles/provision.sql "${cid}:/sms/provision-roles.sql"
          docker cp ../infra/local/postgres-init/10-sms-roles.sh "${cid}:/sms/10-sms-roles.sh"
          for run in 1 2; do
            docker exec -e SMS_MIGRATOR_PASSWORD -e SMS_APP_PASSWORD "${cid}" bash /sms/10-sms-roles.sh
          done
          docker exec "${cid}" psql -U sms -d sms -Atc \
            "SELECT rolname, rolsuper, rolbypassrls, rolcreaterole, rolcreatedb FROM pg_roles WHERE rolname LIKE 'sms\_%' ORDER BY 1"

      - name: Integration tests (PostgreSQL, race detector)
        run: go test -tags integration -race -count=1 ./...

      # Row-level security catalog guard (owner decision RLS-1; testing standards §6): after all
      # migrations are applied, every table with a tenant_id column must have row-level security
      # enabled and forced and a tenant policy. The negative test proves the guard detects violations.
      # (Both tests are also part of the integration run above; this step names the guard in the log.)
      - name: RLS catalog guard (migrated schema, plus deliberately unprotected tables)
        run: go test -tags integration -race -count=1 -v -run 'TestIntegrationMigratedSchemaPassesGuard|TestIntegrationGuardDetectsUnprotectedTables' ./internal/database/rlsguard/

      # RLS evaluation spike (Phase 3 Group 7, ADR-0010; docs/architecture/rls-evaluation.md). These tests
      # create server-wide NOLOGIN roles, so they run only against a disposable server: this job's own
      # PostgreSQL service container. They must run before the migration smoke test below, which
      # migrates the maintenance database (the tests refuse a migrated one). No performance threshold.
      - name: RLS evaluation tests (disposable PostgreSQL service, race detector)
        env:
          RLS_EVAL_DISPOSABLE_SERVER: "1"
        run: |
          set -euo pipefail
          go test -tags integration,rlseval -race -count=1 ./internal/database/rlseval/...
          leftover="$(docker exec "$(docker ps -q --filter "ancestor=${POSTGRES_IMAGE}")" \
            psql -U sms -d sms -Atc "SELECT count(*) FROM pg_roles WHERE starts_with(rolname, 'rlseval_')")"
          echo "test-created roles remaining: ${leftover}"
          test "${leftover}" = "0"

      - name: Build
        run: |
          go build -trimpath -o bin/api ./cmd/api
          go build -trimpath -o bin/migrate ./cmd/migrate
          go build -trimpath -o bin/dispatcher ./cmd/dispatcher
          go build -trimpath -o bin/smsctl ./cmd/smsctl

      # Migrations run as the migration role (Phase 4 Group 1); the bootstrap superuser is refused.
      - name: Migration smoke test (up, status, down, up, as sms_migrator)
        env:
          DB_USER: sms_migrator
          DB_PASSWORD: ${{ env.DB_MIGRATOR_PASSWORD }}
          SUPERUSER_PASSWORD: ci-throwaway-not-a-secret
        run: |
          set -euo pipefail
          psql_sms() { docker exec "$(docker ps -q --filter "ancestor=${POSTGRES_IMAGE}")" psql -U sms -d sms -Atc "$1"; }
          if DB_USER=sms DB_PASSWORD="${SUPERUSER_PASSWORD}" bin/migrate up; then
            echo "migrate ran as the bootstrap superuser"; exit 1
          fi
          test "$(psql_sms "SELECT to_regclass('public.goose_db_version') IS NULL")" = "t"
          bin/migrate status
          bin/migrate up
          bin/migrate status
          latest="$(bin/migrate version)"
          test "${latest}" != "0"
          for _ in $(ls migrations/*.sql); do bin/migrate down; done
          test "$(bin/migrate version)" = "0"
          bin/migrate up
          bin/migrate status
          test "$(bin/migrate version)" = "${latest}"
          # Rollback fails closed: without an explicit APP_ENV it must be refused.
          if env -u APP_ENV bin/migrate down; then echo "migrate down ran without APP_ENV"; exit 1; fi
          test "$(bin/migrate version)" = "${latest}"
          # Every application table belongs to the migration role.
          psql_sms "SELECT tablename, tableowner FROM pg_tables WHERE schemaname = 'public' ORDER BY 1"
          test "$(psql_sms "SELECT count(*) FROM pg_tables WHERE schemaname = 'public' AND tableowner <> 'sms_migrator'")" = "0"

      # The API connects as the application role; any other role makes it refuse to start.
      - name: API smoke test (healthz, readyz, graceful shutdown, as sms_app)
        env:
          DB_USER: sms_app
          DB_PASSWORD: ${{ env.DB_APP_PASSWORD }}
        run: |
          set -euo pipefail
          psql_sms() { docker exec "$(docker ps -q --filter "ancestor=${POSTGRES_IMAGE}")" psql -U sms -d sms -Atc "$1"; }
          bin/api > api.log 2>&1 &
          api_pid=$!
          for _ in $(seq 1 50); do
            curl -fsS http://127.0.0.1:8080/healthz > /dev/null 2>&1 && break
            sleep 0.2
          done
          curl -fsS http://127.0.0.1:8080/healthz
          curl -fsS http://127.0.0.1:8080/readyz
          users="$(psql_sms "SELECT string_agg(DISTINCT usename, ',') FROM pg_stat_activity WHERE application_name = 'sms-api'")"
          echo "API database sessions connected as: ${users}"
          test "${users}" = "sms_app"
          kill -TERM "${api_pid}"
          wait "${api_pid}"
          cat api.log

      # Phase 4 Group 2: the whole messaging flow with the in-process simulator (no SMS, no network).
      - name: Messaging smoke test (API, portal, dispatcher and simulator, as sms_app)
        env:
          DB_USER: sms_app
          DB_PASSWORD: ${{ env.DB_APP_PASSWORD }}
          SIMULATOR_RECEIPT_DELAY: 200ms
        run: |
          set -euo pipefail
          psql_sms() { docker exec "$(docker ps -q --filter "ancestor=${POSTGRES_IMAGE}")" psql -U sms -d sms -Atc "$1"; }
          out="$(bin/smsctl bootstrap --name "CI Smoke Co" --sender-id EXAMPLECO)"
          key="$(grep -E '^smsk_' <<<"${out}")"
          echo "::add-mask::${key}"
          bin/api > api.log 2>&1 &
          api_pid=$!
          bin/dispatcher > dispatcher.log 2>&1 &
          dispatcher_pid=$!
          for _ in $(seq 1 50); do
            curl -fsS http://127.0.0.1:8080/readyz > /dev/null 2>&1 && break
            sleep 0.2
          done
          post() { curl -sS -X POST http://127.0.0.1:8080/v1/messages -H "Authorization: Bearer ${key}" \
            -H 'Content-Type: application/json' -H "Idempotency-Key: $1" --data "$2"; }
          status() { curl -sS "http://127.0.0.1:8080/v1/messages/$1" -H "Authorization: Bearer ${key}" | grep -o '"status":"[a-z_]*"' | head -n 1 | cut -d'"' -f4; }
          id_of() { grep -o '"id":"msg_[A-Za-z0-9]*"' <<<"$1" | cut -d'"' -f4; }
          delivered="$(id_of "$(post ci-1 '{"to":"+639000000001","sender_id":"EXAMPLECO","body":"CI smoke test"}')")"
          uncertain="$(id_of "$(post ci-2 '{"to":"+639000000030","sender_id":"EXAMPLECO","body":"CI smoke test"}')")"
          for _ in $(seq 1 50); do
            [ "$(status "${delivered}")" = delivered ] && [ "$(status "${uncertain}")" = submission_uncertain ] && break
            sleep 0.2
          done
          test "$(status "${delivered}")" = delivered
          test "$(status "${uncertain}")" = submission_uncertain
          test "$(id_of "$(post ci-1 '{"to":"+639000000001","sender_id":"EXAMPLECO","body":"CI smoke test"}')")" = "${delivered}"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/v1/messages)" = 401
          test "$(psql_sms "SELECT count(*) FROM submission_attempts")" = 2
          test "$(psql_sms "SELECT string_agg(DISTINCT usename, ',') FROM pg_stat_activity WHERE application_name = 'sms-dispatcher'")" = sms_app
          # Phase 4 Group 3: the client portal (session cookie + CSRF token) through the same engine.
          tenant="$(grep -oE 'tenant: [0-9a-f-]{36}' <<<"${out}" | cut -d' ' -f2)"
          printf '%s\n' 'ci portal password 1' | bin/smsctl portal-user create --tenant "${tenant}" --email ci@example.invalid --role sender --password-stdin
          headers="$(curl -sS -D - -o login.json -X POST http://127.0.0.1:8080/portal/v1/session -H 'Content-Type: application/json' \
            --data '{"email":"ci@example.invalid","password":"ci portal password 1"}')"
          cookie="$(grep -i '^set-cookie: __Host-sms_session=' <<<"${headers}" | sed -E 's/^[^:]*: ([^;]*);.*/\1/')"
          csrf="$(grep -o '"csrf_token":"[a-z0-9]*"' login.json | cut -d'"' -f4)"
          echo "::add-mask::${cookie}"
          echo "::add-mask::${csrf}"
          grep -qi '^set-cookie: __Host-sms_session=.*HttpOnly.*Secure.*SameSite=Strict' <<<"${headers}"
          portal() { curl -sS "http://127.0.0.1:8080/portal/v1/$1" -H "Cookie: ${cookie}" "${@:2}"; }
          code_of() { curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080/portal/v1/$1" -H "Cookie: ${cookie}" "${@:2}"; }
          body='{"to":"+639000000002","sender_id":"EXAMPLECO","body":"CI portal smoke test"}'
          test "$(code_of messages -X POST -H 'Content-Type: application/json' -H 'Idempotency-Key: ci-p1' --data "${body}")" = 403
          pmsg="$(id_of "$(portal messages -X POST -H "X-CSRF-Token: ${csrf}" -H 'Content-Type: application/json' -H 'Idempotency-Key: ci-p1' --data "${body}")")"
          test -n "${pmsg}"
          for _ in $(seq 1 50); do
            portal "messages/${pmsg}" | grep -q '"status":"delivered"' && break
            sleep 0.2
          done
          portal "messages/${pmsg}" | grep -q '"status":"delivered"'
          test "$(code_of session -X DELETE -H "X-CSRF-Token: ${csrf}")" = 204
          test "$(code_of session)" = 401
          kill -TERM "${dispatcher_pid}" "${api_pid}"
          wait "${dispatcher_pid}" "${api_pid}"
          if grep -qF "${key}" api.log dispatcher.log; then echo "a log contains the API key"; exit 1; fi
          if grep -qF 'ci portal password 1' api.log dispatcher.log; then echo "a log contains the portal password"; exit 1; fi
          cat dispatcher.log

      - name: API refuses to start with an unsafe database role
        env:
          SUPERUSER_PASSWORD: ci-throwaway-not-a-secret
        run: |
          set -euo pipefail
          refuse() { # refuse <user> <password> <expected message>
            if DB_USER="$1" DB_PASSWORD="$2" timeout 20 bin/api > refused.log 2>&1; then
              echo "the API started as $1"; cat refused.log; exit 1
            fi
            cat refused.log
            grep -q "$3" refused.log
            ! curl -fsS -o /dev/null http://127.0.0.1:8080/healthz
          }
          refuse sms "${SUPERUSER_PASSWORD}" 'refusing to use database role "sms" as the application role: is a superuser'
          refuse sms_migrator "${DB_MIGRATOR_PASSWORD}" 'as the application role: owns tables or other relations'
          # The dispatcher applies the same check.
          if DB_USER=sms DB_PASSWORD="${SUPERUSER_PASSWORD}" timeout 20 bin/dispatcher > refused.log 2>&1; then
            echo "the dispatcher started as the bootstrap superuser"; cat refused.log; exit 1
          fi
          cat refused.log
          grep -q 'refusing to use database role "sms" as the application role: is a superuser' refused.log

  lint:
    name: Go lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          # Build the linter with the pinned Go toolchain so it understands the module's Go version.
          install-mode: goinstall
          working-directory: backend

  vulncheck:
    name: Go vulnerability check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            backend/go.sum
            backend/tools/go.sum

      - name: govulncheck
        run: go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...

      # The code generators run in CI and on developer machines, so their module is scanned too.
      - name: govulncheck (tools module)
        run: |
          go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" -C tools github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen
          go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" -C tools github.com/sqlc-dev/sqlc/cmd/sqlc

  generate-windows:
    name: Go generate check (Windows)
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
        shell: pwsh
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            backend/go.sum
            backend/tools/go.sum

      # The exact command documented in backend/README.md, run from backend/ in PowerShell.
      - name: Regenerate public API code
        run: go generate ./internal/publicapi/...

      # The client portal API (Phase 4 Group 3), same generator and command form.
      - name: Regenerate portal API code
        run: go generate ./internal/portalapi/...

      - name: Check generated code is unchanged
        run: |
          git diff --exit-code -- internal/publicapi internal/portalapi
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::Generated code differs on Windows."; exit 1 }
          $changed = git status --porcelain --untracked-files=all -- internal/publicapi internal/portalapi tools
          if ($changed) { Write-Output "::error::Uncommitted generated files:"; $changed; exit 1 }

      - name: Test generated types
        run: go test -count=1 ./internal/publicapi/...

      # The documented sqlc command (Phase 4 Group 1), run in PowerShell: sqlc is built without cgo.
      - name: Regenerate sqlc code
        run: go generate ./internal/database/...

      - name: Check sqlc code is unchanged
        run: |
          git diff --exit-code -- internal/database/sqlcgen
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::sqlc output differs on Windows."; exit 1 }
          $changed = git status --porcelain --untracked-files=all -- internal/database/sqlcgen tools
          if ($changed) { Write-Output "::error::Uncommitted sqlc files:"; $changed; exit 1 }
