# Backend CI — Phase 3 Group 1 (Go API skeleton), Group 2 (PostgreSQL foundation) and Group 4 (Go code
# generated from the public API contract).
#
# The job names below are the status-check names required on `main`; do not rename them:
#   "Go test and build", "Go lint", "Go vulnerability check".
# Group 4 adds "Go generate check (Windows)", which proves the documented generation command on Windows.
#
# Security: least-privilege token (read-only contents), actions pinned to full commit SHAs, no
# repository secrets used, credentials not persisted after checkout. Tool versions are pinned in
# `env`. The PostgreSQL password below is a throwaway value for a service container that exists
# only for the duration of the job and is reachable only from the runner's loopback interface.
name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.4"           # decision log §7; must match backend/go.mod `toolchain`
  GOTOOLCHAIN: local             # never download a different toolchain inside CI
  GOLANGCI_LINT_VERSION: v2.15.0
  GOVULNCHECK_VERSION: v1.10.0
  # PostgreSQL 18 (ADR-0005), pinned by tag and multi-platform digest (owner decision L2, Group 6).
  # Must be identical to infra/local/compose.yaml; the "Local stack check" job enforces this.
  POSTGRES_IMAGE: postgres:18.7-trixie@sha256:c699303802144847d238196173655dbbecf7a96aeca1565f2b02eb671a1f0b6b

defaults:
  run:
    working-directory: backend

jobs:
  test:
    name: Go test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        # Service images cannot use the workflow-level env; keep in sync with POSTGRES_IMAGE.
        image: postgres:18.7-trixie@sha256:c699303802144847d238196173655dbbecf7a96aeca1565f2b02eb671a1f0b6b
        env:
          POSTGRES_DB: sms
          POSTGRES_USER: sms
          POSTGRES_PASSWORD: ci-throwaway-not-a-secret
        ports:
          - 127.0.0.1:5432:5432
        # The job's steps start only after this health check passes.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -p 5432 -U sms -d sms"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      APP_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: sms
      DB_USER: sms
      DB_PASSWORD: ci-throwaway-not-a-secret
      DB_SSLMODE: disable
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            backend/go.sum
            backend/tools/go.sum

      - name: Show Go version
        run: go version

      - name: Check formatting (gofmt)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify modules
        run: |
          go mod verify
          go mod tidy -diff
          # The separate module that version-locks the code generators (owner decision D5).
          go -C tools mod verify
          go -C tools mod tidy -diff

      # Generated code must match the approved specification and must never be edited by hand: regenerate
      # with the locked generator and fail on any difference, on any new or modified file, or if two runs
      # differ (non-deterministic output).
      - name: Check generated code is up to date
        run: |
          set -euo pipefail
          # The generator writes exactly one file; any other *.gen.go here was not generated by it.
          generated="$(git ls-files -- 'internal/publicapi/*.gen.go')"
          if [ "${generated}" != "internal/publicapi/publicapi.gen.go" ]; then
            echo "::error::Unexpected generated-looking files in internal/publicapi: ${generated}"
            exit 1
          fi
          go generate ./internal/publicapi/...
          if ! git diff --exit-code -- internal/publicapi; then
            echo "::error::internal/publicapi is stale or was edited by hand. Run 'go generate ./internal/publicapi/...' from backend/ and commit the result."
            exit 1
          fi
          changed="$(git status --porcelain --untracked-files=all -- internal/publicapi tools)"
          if [ -n "${changed}" ]; then
            echo "::error::Generation created or modified files that are not committed:"
            echo "${changed}"
            exit 1
          fi
          first="$(sha256sum internal/publicapi/publicapi.gen.go)"
          go generate ./internal/publicapi/...
          if [ "${first}" != "$(sha256sum internal/publicapi/publicapi.gen.go)" ]; then
            echo "::error::Code generation is not deterministic."
            exit 1
          fi

      - name: go vet
        run: |
          go vet ./...
          go vet -tags integration ./...

      - name: Unit tests
        run: go test -count=1 ./...

      - name: Race tests
        run: go test -race -count=1 ./...

      - name: Check PostgreSQL service version
        run: |
          docker ps --filter "ancestor=${POSTGRES_IMAGE}" --format '{{.Image}} {{.Status}}'
          version="$(docker exec "$(docker ps -q --filter "ancestor=${POSTGRES_IMAGE}")" \
            psql -U sms -d sms -Atc 'SHOW server_version')"
          echo "PostgreSQL server_version: ${version}"
          case "${version}" in 18.*) ;; *) echo "expected PostgreSQL 18.x"; exit 1 ;; esac

      - name: Integration tests (PostgreSQL, race detector)
        run: go test -tags integration -race -count=1 ./...

      - name: Build
        run: |
          go build -trimpath -o bin/api ./cmd/api
          go build -trimpath -o bin/migrate ./cmd/migrate

      - name: Migration smoke test (up, status, down, up)
        run: |
          set -euo pipefail
          bin/migrate status
          bin/migrate up
          bin/migrate status
          test "$(bin/migrate version)" != "0"
          bin/migrate down
          test "$(bin/migrate version)" = "0"
          bin/migrate up
          bin/migrate status
          # Rollback fails closed: without an explicit APP_ENV it must be refused.
          if env -u APP_ENV bin/migrate down; then echo "migrate down ran without APP_ENV"; exit 1; fi
          test "$(bin/migrate version)" != "0"

      - name: API smoke test (healthz, readyz, graceful shutdown)
        run: |
          set -euo pipefail
          bin/api > api.log 2>&1 &
          api_pid=$!
          for _ in $(seq 1 50); do
            curl -fsS http://127.0.0.1:8080/healthz > /dev/null 2>&1 && break
            sleep 0.2
          done
          curl -fsS http://127.0.0.1:8080/healthz
          curl -fsS http://127.0.0.1:8080/readyz
          kill -TERM "${api_pid}"
          wait "${api_pid}"
          cat api.log

  lint:
    name: Go lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          # Build the linter with the pinned Go toolchain so it understands the module's Go version.
          install-mode: goinstall
          working-directory: backend

  vulncheck:
    name: Go vulnerability check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            backend/go.sum
            backend/tools/go.sum

      - name: govulncheck
        run: go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...

      # The code generator runs in CI and on developer machines, so its own module is scanned too.
      - name: govulncheck (tools module)
        run: go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" -C tools github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen

  generate-windows:
    name: Go generate check (Windows)
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
        shell: pwsh
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            backend/go.sum
            backend/tools/go.sum

      # The exact command documented in backend/README.md, run from backend/ in PowerShell.
      - name: Regenerate public API code
        run: go generate ./internal/publicapi/...

      - name: Check generated code is unchanged
        run: |
          git diff --exit-code -- internal/publicapi
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::Generated code differs on Windows."; exit 1 }
          $changed = git status --porcelain --untracked-files=all -- internal/publicapi tools
          if ($changed) { Write-Output "::error::Uncommitted generated files:"; $changed; exit 1 }

      - name: Test generated types
        run: go test -count=1 ./internal/publicapi/...
