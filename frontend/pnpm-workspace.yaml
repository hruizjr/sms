# pnpm workspace for the frontend (ADR-0013; owner decisions F5 and package age policy, decision log §10).
# Separate from contracts/, with its own lockfile. Run every pnpm command from this directory.
packages:
  - apps/*
  - packages/*

# Supply-chain safety margin: never resolve a package version published less than 7 days ago
# (10080 minutes), for direct and transitive dependencies alike. With this setting, pnpm 10.34.9
# fails the install when no version old enough matches (ERR_PNPM_NO_MATURE_MATCHING_VERSION) and
# when the registry metadata has no publication time (ERR_PNPM_MISSING_TIME); it never falls back
# to a newer version. Verified for the pinned pnpm in Phase 3 Group 5 (frontend/README.md).
minimumReleaseAge: 10080

# Owner-requested explicit settings. pnpm 10.34.9 does not read these two keys (they are pnpm 11
# settings); the behaviour they describe is already how pnpm 10.34.9 applies minimumReleaseAge, as
# described above. They keep the policy explicit if pnpm is upgraded.
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false

# Exact versions, defined once and referenced as "catalog:" from each package.json.
catalog:
  '@eslint/js': 10.0.1
  '@tailwindcss/vite': 4.3.5
  '@testing-library/dom': 10.4.2
  '@testing-library/jest-dom': 7.0.1
  '@testing-library/react': 16.3.3
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@vitejs/plugin-react': 6.3.0
  eslint: 10.15.0
  eslint-plugin-react-hooks: 7.1.1
  jsdom: 31.0.1
  openapi-typescript: 7.13.0
  prettier: 3.10.1
  prettier-plugin-tailwindcss: 0.8.1
  react: 19.3.1
  react-dom: 19.3.1
  tailwindcss: 4.3.5
  typescript: 6.0.3
  typescript-eslint: 8.73.0
  vite: 8.3.8
  vitest: 5.1.1
